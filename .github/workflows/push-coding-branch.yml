---
on:
  push:

jobs:
  code-format-check:
    name: Code Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v2
      - uses: actions/checkout@v4

      - name: Add LLVM repo
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update

      - name: Install clang-format
        run: |
          sudo apt-get install -y clang-format-22
          clang-format-22 --version
      - name: Check code formatting
        run: |
          # Find all C++ source files in src and tests directories
          files=$(find src tests -type f \( -name "*.cpp" -o -name "*.h" \
            -o -name "*.hpp" -o -name "*.c" -o -name "*.cc" \) \
            2>/dev/null || true)

          if [ -z "$files" ]; then
            echo "No C++ source files found in src or tests directories"
            exit 0
          fi

          # Check formatting for each file
          format_errors=0
          for file in $files; do
            if ! clang-format-22 --dry-run -Werror "$file" >/dev/null 2>&1; then
              echo "Error: $file is not formatted correctly"
              echo "Please run: clang-format-22 -i $file"
              format_errors=$((format_errors + 1))
            fi
          done

          if [ $format_errors -gt 0 ]; then
            echo "Found $format_errors file(s) with formatting issues"
            exit 1
          fi

          echo "All files are formatted correctly!"

  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONAN_SKIPS: "glfw imgui cli11"
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: sudo apt install cmake ninja-build
      - name: Install Conan
        uses: conan-io/setup-conan@v1
      - name: Install dependencies
        run: |
          conan install . -of .conan -s build_type=Release --build=missing \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True
      - name: Build project
        run: |
          cmake --preset rel-core_impl-with_tests
          cmake --build build/rel-core_impl-with_tests
      - name: Run tests
        run: |
          cd build/rel-core_impl-with_tests
          ctest
